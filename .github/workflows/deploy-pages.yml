name: PROTECAT · Tests et publication PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: catena-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les règles de démonstration
        run: node tests/test_core.js && node tests/test_pwa.js
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publier PROTECAT
        id: deployment
        uses: actions/deploy-pages@v4
